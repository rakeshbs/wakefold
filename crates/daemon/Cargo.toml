[package]
name = "wakefold-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
sandbox = ["dep:tempfile", "tokio/io-util", "tokio/sync"]

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
subtle = "2"
tokio-rustls = "0.26"
percent-encoding = "2"
rmcp = { version = "3.11", default-features = false, features = ["client", "transport-child-process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = { version = "3", optional = true }
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std"] }
wakefold = { path = "../core", default-features = false, features = ["openai"] }

[dev-dependencies]
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tempfile = "3"
tokio-tungstenite = "0.29"

[[bin]]
name = "wakefold"
path = "src/main.rs"
doc = false
