[package]
name = "wakefold"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["derive"]
derive = ["dep:schemars", "dep:serde", "dep:wakefold-macros"]
openai = ["dep:async-openai", "dep:httpdate", "dep:reqwest", "dep:serde", "dep:tower"]
test-util = []

[dependencies]
async-openai = { version = "0.43", default-features = false, features = ["middleware", "responses", "rustls"], optional = true }
futures-timer = "3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
async-trait = "0.1"
httpdate = { version = "1", optional = true }
rand = "0.10"
rusqlite = { version = "0.38", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, optional = true }
schemars = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
thiserror = "2"
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"], optional = true }
wakefold-macros = { version = "0.1.0", path = "../macros", optional = true }

[dev-dependencies]
tempfile = "3"
futures-executor = "0.3"
http = "1"
tokio = { version = "1", features = ["macros", "rt", "test-util"] }

[[example]]
name = "scripted_agent"
test = true
required-features = ["derive", "test-util"]

[[test]]
name = "offline_agent"
required-features = ["test-util"]

[[test]]
name = "tool_derive"
required-features = ["derive"]

[[test]]
name = "cancellation"
required-features = ["test-util"]

[[test]]
name = "workspace"
required-features = ["derive", "test-util"]
