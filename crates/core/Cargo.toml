[package]
name = "wakefold"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["derive"]
derive = ["dep:schemars", "dep:wakefold-macros"]
openai = ["dep:async-openai", "dep:httpdate", "dep:reqwest", "dep:tower"]
test-util = []

[dependencies]
async-openai = { version = "0.43", default-features = false, features = ["middleware", "responses", "rustls"], optional = true }
chrono = "0.4"
chrono-tz = "0.10"
cap-std = "4"
futures-channel = "0.3"
futures-timer = "3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
async-trait = "0.1"
httpdate = { version = "1", optional = true }
mime_guess = "2"
rand = "0.10"
rusqlite = { version = "0.38", features = ["bundled", "fallible_uint", "uuid"] }
reqwest = { version = "0.13", default-features = false, optional = true }
schemars = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio-util = "0.7"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tower = { version = "0.5", features = ["util"], optional = true }
uuid = { version = "1", features = ["serde", "v4"] }
wakefold-macros = { version = "0.1.0", path = "../macros", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
futures-executor = "0.3"
http = "1"
tokio = { version = "1", features = ["macros", "rt", "test-util"] }

[[example]]
name = "scripted_agent"
test = true
required-features = ["derive", "test-util"]

[[test]]
name = "offline_agent"
required-features = ["test-util"]

[[test]]
name = "tool_derive"
required-features = ["derive"]

[[test]]
name = "cancellation"
required-features = ["test-util"]

[[test]]
name = "workspace"
required-features = ["derive", "test-util"]

[[test]]
name = "tool_recovery"
required-features = ["test-util"]
